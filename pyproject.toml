[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autosave-claim-audit"
version = "0.1.0"
description = "Offline static audit of documented automatic-saving promises"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Claim Audit contributors"}]
dependencies = []

[project.scripts]
autosave-claim-audit = "autosave_claim_audit.cli:main"

[tool.setuptools.packages.find]
include = ["autosave_claim_audit*"]
